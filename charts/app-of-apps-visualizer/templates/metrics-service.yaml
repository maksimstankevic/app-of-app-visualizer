apiVersion: v1
kind: Service
metadata:
  name: {{ include "app-of-apps-visualizer.fullname" . }}-controller-manager-metrics-service
  labels:
    app.kubernetes.io/component: kube-rbac-proxy
    app.kubernetes.io/created-by: app-of-app-visualizer
    app.kubernetes.io/part-of: app-of-app-visualizer
    control-plane: controller-manager
  {{- include "app-of-apps-visualizer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.metricsService.type }}
  selector:
    control-plane: controller-manager
  {{- include "app-of-apps-visualizer.selectorLabels" . | nindent 4 }}
  ports:
	{{- .Values.metricsService.ports | toYaml | nindent 2 }}